[package]
name = "orion-audio-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "=4.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sonora = "=0.2.0"
sysinfo = { version = "=0.30.13", default-features = false }
webrtc-vad = "=0.4.0"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.3"
widestring = "1.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4.3"
orion-macos-system-audio = { path = "../macos-system-audio" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
